<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
    button { padding: 6px 12px; cursor: pointer; margin-right: 5px; }
    .btn-hapus { background-color: #dc3545; color: white; border: none; border-radius: 3px; }
    .btn-hapus:hover { background-color: #bd2130; }
    .container { display: flex; gap: 20px; }
    .box { flex: 1; border: 1px solid #ccc; padding: 15px; border-radius: 5px; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
    .modal-content { background: white; padding: 20px; margin: 10% auto; width: 300px; border-radius: 5px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; margin-bottom: 5px; }
    .form-group input { width: 95%; padding: 6px; }
  </style>
</head>
<body>

  <h2>Sistem Kasir POS</h2>

  <div class="container">
    <!-- BAGIAN DAFTAR MENU -->
    <div class="box">
      <h3>Daftar Menu</h3>
      <button onclick="openModalTambah()">+ Tambah Menu</button>
      <p id="loading">Memuat data...</p>

      <table>
        <thead>
          <tr>
            <th>Menu</th>
            <th>Harga</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tabel-menu"></tbody>
      </table>
    </div>

    <!-- BAGIAN KERANJANG TRANSAKSI -->
    <div class="box">
      <h3>Keranjang Transaksi</h3>
      <ul id="list-keranjang"></ul>
      <p><b>Total: Rp <span id="total-harga">0</span></b></p>
      <button onclick="prosesTransaksi()" id="btn-proses" disabled>Proses Transaksi</button>
    </div>
  </div>

  <!-- MODAL TAMBAH / EDIT MENU -->
  <div id="modalMenu" class="modal">
    <div class="modal-content">
      <h3 id="modal-title">Tambah Menu</h3>
      <input type="hidden" id="edit-nama-lama">
      
      <div class="form-group">
        <label>Nama Menu:</label>
        <input type="text" id="input-nama">
      </div>
      
      <div class="form-group">
        <label>Harga:</label>
        <input type="number" id="input-harga">
      </div>

      <button onclick="simpanMenu()">Simpan</button>
      <button onclick="closeModal()">Batal</button>
    </div>
  </div>

  <script>
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzih2YF2_IoDn1pqmzxV-qMK_T_Tpi9q8b7yRR6ggFMW4YMLGvqkNFSvabGiZPszp7g/exec";

    let keranjang = [];
    let isEdit = false;

    window.onload = loadMenu;

    // 1. TAMPILKAN MENU
    function loadMenu() {
      document.getElementById("loading").style.display = "block";
      fetch(`${URL_APPS_SCRIPT}?action=getMenu`)
        .then(res => res.json())
        .then(data => {
          document.getElementById("loading").style.display = "none";
          const list = Array.isArray(data) ? data : (data.result || []);
          const tbody = document.getElementById("tabel-menu");
          tbody.innerHTML = "";

          list.forEach(item => {
            const nama = item.name || item.nama || item[0] || "";
            const harga = item.price || item.harga || item[1] || 0;

            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${nama}</td>
              <td>Rp ${Number(harga).toLocaleString("id-ID")}</td>
              <td>
                <button onclick="tambahKeKeranjang('${nama}', ${harga})">+ Keranjang</button>
                <button onclick="openModalEdit('${nama}', ${harga})">Edit</button>
                <button class="btn-hapus" onclick="hapusMenu('${nama}')">Hapus</button>
              </td>
            `;
            tbody.appendChild(tr);
          });
        })
        .catch(err => {
          document.getElementById("loading").innerText = "Gagal memuat data!";
        });
    }

    // 2. FUNGSI HAPUS MENU
    function hapusMenu(nama) {
      if (!confirm(`Apakah Anda yakin ingin menghapus menu "${nama}"?`)) return;

      const params = new URLSearchParams();
      params.append("action", "hapus_menu");
      params.append("nama", nama);

      fetch(URL_APPS_SCRIPT, { method: "POST", body: params })
        .then(res => res.json())
        .then(res => {
          alert(res.message || "Menu berhasil dihapus!");
          loadMenu();
        })
        .catch(err => alert("Gagal menghapus menu."));
    }

    // 3. MODAL TAMBAH & EDIT
    function openModalTambah() {
      isEdit = false;
      document.getElementById("modal-title").innerText = "Tambah Menu";
      document.getElementById("input-nama").value = "";
      document.getElementById("input-harga").value = "";
      document.getElementById("modalMenu").style.display = "block";
    }

    function openModalEdit(nama, harga) {
      isEdit = true;
      document.getElementById("modal-title").innerText = "Edit Menu";
      document.getElementById("edit-nama-lama").value = nama;
      document.getElementById("input-nama").value = nama;
      document.getElementById("input-harga").value = harga;
      document.getElementById("modalMenu").style.display = "block";
    }

    function closeModal() {
      document.getElementById("modalMenu").style.display = "none";
    }

    // 4. SIMPAN (TAMBAH / EDIT)
    function simpanMenu() {
      const namaInput = document.getElementById("input-nama").value;
      const hargaInput = document.getElementById("input-harga").value;
      const namaLama = document.getElementById("edit-nama-lama").value;

      if (!namaInput || !hargaInput) {
        alert("Isi nama dan harga terlebih dahulu!");
        return;
      }

      const params = new URLSearchParams();
      if (isEdit) {
        params.append("action", "edit_menu");
        params.append("namaLama", namaLama);
        params.append("namaBaru", namaInput);
        params.append("hargaBaru", hargaInput);
      } else {
        params.append("action", "tambah_menu");
        params.append("nama", namaInput);
        params.append("harga", hargaInput);
      }

      fetch(URL_APPS_SCRIPT, { method: "POST", body: params })
        .then(res => res.json())
        .then(res => {
          alert(res.message || "Berhasil disimpan!");
          closeModal();
          loadMenu();
        })
        .catch(err => alert("Gagal menyimpan menu."));
    }

    // 5. KERANJANG & TRANSAKSI
    function tambahKeKeranjang(nama, harga) {
      const item = keranjang.find(i => i.nama === nama);
      if (item) {
        item.qty += 1;
      } else {
        keranjang.push({ nama, harga, qty: 1 });
      }
      renderKeranjang();
    }

    function renderKeranjang() {
      const ul = document.getElementById("list-keranjang");
      ul.innerHTML = "";
      let total = 0;

      keranjang.forEach(item => {
        const subtotal = item.harga * item.qty;
        total += subtotal;
        const li = document.createElement("li");
        li.innerText = `${item.nama} x${item.qty} = Rp ${subtotal.toLocaleString("id-ID")}`;
        ul.appendChild(li);
      });

      document.getElementById("total-harga").innerText = total.toLocaleString("id-ID");
      document.getElementById("btn-proses").disabled = keranjang.length === 0;
    }

    function prosesTransaksi() {
      const detail = keranjang.map(i => `${i.nama} (${i.qty})`).join(", ");
      const total = keranjang.reduce((acc, i) => acc + (i.harga * i.qty), 0);

      const params = new URLSearchParams();
      params.append("action", "transaksi");
      params.append("items", detail);
      params.append("total", total);

      fetch(URL_APPS_SCRIPT, { method: "POST", body: params })
        .then(res => res.json())
        .then(res => {
          alert("Transaksi Berhasil!");
          keranjang = [];
          renderKeranjang();
        })
        .catch(err => alert("Gagal memproses transaksi."));
    }
  </script>
</body>
</html>
