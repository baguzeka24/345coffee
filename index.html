<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Three4Five Coffee - Sheets Driven</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{font-family:Inter, Poppins, sans-serif;background:#f8fafc;color:#0f172a;margin:0}
    .card{border-radius:12px}
    .hidden{display:none}
    .menu-img{height:110px;object-fit:cover}
    .btn-success-custom{background:#064e3b;color:#fff;border-radius:10px;border:0;padding:10px 14px}
  </style>
</head>
<body>
  <nav class="navbar bg-white shadow-sm mb-3">
    <div class="container-fluid"><span class="navbar-brand mb-0 h1">Three4Five Coffee</span></div>
  </nav>

  <div class="container">
    <div id="alerts"></div>

    <div class="row">
      <div class="col-md-8">
        <h5>Menu</h5>
        <div id="menu-grid" class="row g-3"></div>
      </div>

      <div class="col-md-4">
        <div class="card p-3">
          <h6>Pesanan</h6>
          <div id="cart-list" class="mb-3">Keranjang kosong</div>
          <div class="d-flex justify-content-between"><strong>Total:</strong><span id="total-text">Rp 0</span></div>
          <div class="mt-3">
            <label>Metode</label>
            <select id="payment-method" class="form-select mb-2"><option value="Tunai">Tunai</option><option value="QRIS">QRIS</option></select>
            <input id="cash-input" class="form-control mb-2" placeholder="Uang tunai diterima (Opsional)" type="number">
            <button id="pay-btn" class="btn btn-success-custom w-100">Bayar & Simpan</button>
          </div>
        </div>

        <div class="card p-3 mt-3">
          <h6>Admin</h6>
          <button id="reload-data" class="btn btn-outline-primary w-100 mb-2">Reload data from Sheets</button>
          <button id="open-admin" class="btn btn-outline-secondary w-100">Open Admin</button>
        </div>
      </div>
    </div>

    <!-- Admin modal -->
    <div id="admin-modal" class="modal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header"><h5 class="modal-title">Admin - Edit Menu & Users</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
          <div class="modal-body">
            <h6>Menu (edit JSON)</h6>
            <textarea id="admin-menu-json" class="form-control" rows="8"></textarea>
            <div class="mt-2 d-flex gap-2">
              <button id="save-menu" class="btn btn-success-custom">Save Menu to Sheets</button>
              <button id="refresh-menu-json" class="btn btn-outline-secondary">Reload from Sheets</button>
            </div>

            <h6 class="mt-3">Users (edit JSON)</h6>
            <textarea id="admin-users-json" class="form-control" rows="6"></textarea>
            <div class="mt-2 d-flex gap-2">
              <button id="save-users" class="btn btn-success-custom">Save Users to Sheets</button>
              <button id="refresh-users-json" class="btn btn-outline-secondary">Reload users</button>
            </div>

            <h6 class="mt-3">Ingredients (edit JSON)</h6>
            <textarea id="admin-ings-json" class="form-control" rows="6"></textarea>
            <div class="mt-2 d-flex gap-2">
              <button id="save-ings" class="btn btn-success-custom">Save Ingredients to Sheets</button>
              <button id="refresh-ings-json" class="btn btn-outline-secondary">Reload ingredients</button>
            </div>
          </div>
          <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Close</button></div>
        </div>
      </div>
    </div>

  </div>

  <!-- Load helper: set APP_SCRIPT_URL before loading if needed -->
  <script>
    // REPLACE with your deployed Apps Script Web App URL:
    window.__three4five_config = { APP_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbzIPIrVEt3VYFwzUS-a1D5bmL6LUXzG4hH9jEirGn_a1s1C-Mu4bBwWo_83pt7kscBc5w/exec', forceSyncOnLoad: false };
  </script>
  <script src="data/sheets-helper.js" data-app-script-url="https://script.google.com/macros/s/AKfycbzIPIrVEt3VYFwzUS-a1D5bmL6LUXzG4hH9jEirGn_a1s1C-Mu4bBwWo_83pt7kscBc5w/exec"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // App state (in-memory)
    let menuList = [];
    let usersList = [];
    let ingredientsList = [];
    let cart = [];

    const alertEl = document.getElementById('alerts');
    function info(msg){ alertEl.innerHTML = `<div class="alert alert-info">${msg}</div>`; setTimeout(()=>alertEl.innerHTML='',3500); }
    function error(msg){ alertEl.innerHTML = `<div class="alert alert-danger">${msg}</div>`; setTimeout(()=>alertEl.innerHTML='',4500); }

    async function loadAll() {
      try {
        menuList = await window.__three4five_sheets.getMenu();
        usersList = await window.__three4five_sheets.getUsers();
        ingredientsList = await window.__three4five_sheets.getIngredients();
        renderMenu();
        info('Data berhasil dimuat dari Sheets');
      } catch (e) {
        console.error(e);
        error('Gagal memuat data dari Sheets: ' + (e.message || e));
      }
    }

    function renderMenu() {
      const grid = document.getElementById('menu-grid');
      grid.innerHTML = '';
      if (!Array.isArray(menuList) || menuList.length === 0) {
        grid.innerHTML = '<div class="col-12">Tidak ada menu.</div>'; return;
      }
      menuList.forEach(item => {
        const col = document.createElement('div'); col.className='col-md-6';
        col.innerHTML = `
          <div class="card p-2">
            <div class="row g-0 align-items-center">
              <div class="col-4"><img class="menu-img rounded" src="${item.image || ''}" alt="${item.name || ''}"></div>
              <div class="col-8 ps-2">
                <div class="fw-bold">${item.name || ''}</div>
                <div class="text-success">${formatRupiah(Number(item.price)||0)}</div>
                <div class="mt-2"><button class="btn btn-outline-primary btn-sm" onclick="addToCart(${item.id})">Tambah</button></div>
              </div>
            </div>
          </div>`;
        grid.appendChild(col);
      });
      renderCart();
    }

    function formatRupiah(n){ return 'Rp ' + (n||0).toLocaleString('id-ID'); }

    function addToCart(id){
      const item = menuList.find(m=>Number(m.id)===Number(id));
      if(!item){ return error('Item tidak ditemukan'); }
      const existing = cart.find(c=>c.id===id);
      if(existing) existing.qty++;
      else cart.push({ id:item.id, name:item.name, price:Number(item.price)||0, qty:1 });
      renderCart();
    }

    function renderCart(){
      const el = document.getElementById('cart-list');
      el.innerHTML = '';
      if(cart.length===0){ el.innerText='Keranjang kosong'; document.getElementById('total-text').innerText='Rp 0'; return; }
      let total=0;
      cart.forEach((c,idx)=>{
        total += c.price * c.qty;
        const row = document.createElement('div'); row.className='d-flex justify-content-between align-items-center mb-2';
        row.innerHTML = `<div>${c.name} <small class="text-muted">x${c.qty}</small></div><div>${formatRupiah(c.price*c.qty)} <button class="btn btn-link btn-sm" onclick="removeCart(${idx})">hapus</button></div>`;
        el.appendChild(row);
      });
      document.getElementById('total-text').innerText = formatRupiah(total);
    }

    function removeCart(idx){ cart.splice(idx,1); renderCart(); }

    document.getElementById('pay-btn').addEventListener('click', async function(){
      if(cart.length===0) return error('Keranjang kosong');
      const method = document.getElementById('payment-method').value;
      const cash = Number(document.getElementById('cash-input').value) || 0;
      const total = cart.reduce((s,i)=>s + (i.price*i.qty),0);
      if(method === 'Tunai' && cash < total) return error('Uang tunai kurang');

      const trx = {
        date: (new Date()).toISOString(),
        items: cart.map(i=>({ id:i.id, name:i.name, qty:i.qty, price:i.price })),
        method: method,
        total: total,
        cashReceived: method==='Tunai' ? cash : total,
        change: method==='Tunai' ? (cash - total) : 0,
        timestamp: Date.now()
      };

      try {
        const r = await window.__three4five_sheets.addTransaction(trx);
        if (r && r.ok) {
          info('Transaksi tersimpan di Sheets');
          cart = [];
          renderCart();
        } else {
          error('Gagal menyimpan transaksi: ' + (r && r.error ? r.error : 'unknown'));
        }
      } catch (e) {
        console.error(e);
        error('Error saat menyimpan transaksi: ' + (e.message||e));
      }
    });

    // Admin modal actions
    const adminModal = new bootstrap.Modal(document.getElementById('admin-modal'));
    document.getElementById('open-admin').addEventListener('click', async ()=>{
      await refreshAdminJson();
      adminModal.show();
    });
    document.getElementById('reload-data').addEventListener('click', ()=>loadAll());

    async function refreshAdminJson(){
      try {
        const menu = await window.__three4five_sheets.getMenu();
        document.getElementById('admin-menu-json').value = JSON.stringify(menu, null, 2);
        const users = await window.__three4five_sheets.getUsers();
        document.getElementById('admin-users-json').value = JSON.stringify(users, null, 2);
        const ings = await window.__three4five_sheets.getIngredients();
        document.getElementById('admin-ings-json').value = JSON.stringify(ings, null, 2);
      } catch (e) { console.error(e); error('Gagal load admin data'); }
    }

    document.getElementById('refresh-menu-json').addEventListener('click', refreshAdminJson);
    document.getElementById('refresh-users-json').addEventListener('click', refreshAdminJson);
    document.getElementById('refresh-ings-json').addEventListener('click', refreshAdminJson);

    document.getElementById('save-menu').addEventListener('click', async ()=>{
      try {
        const arr = JSON.parse(document.getElementById('admin-menu-json').value || '[]');
        const r = await window.__three4five_sheets.saveMenu(arr);
        if (r && r.ok) { info('Menu disimpan di Sheets'); loadAll(); }
        else error('Gagal simpan menu: ' + (r && r.error? r.error : 'unknown'));
      } catch (e) { error('JSON invalid'); }
    });

    document.getElementById('save-users').addEventListener('click', async ()=>{
      try {
        const arr = JSON.parse(document.getElementById('admin-users-json').value || '[]');
        const r = await window.__three4five_sheets.saveUsers(arr);
        if (r && r.ok) { info('Users disimpan di Sheets'); loadAll(); }
        else error('Gagal simpan users: ' + (r && r.error? r.error : 'unknown'));
      } catch (e) { error('JSON invalid'); }
    });

    document.getElementById('save-ings').addEventListener('click', async ()=>{
      try {
        const arr = JSON.parse(document.getElementById('admin-ings-json').value || '[]');
        const r = await window.__three4five_sheets.saveIngredients(arr);
        if (r && r.ok) { info('Ingredients disimpan di Sheets'); loadAll(); }
        else error('Gagal simpan ingredients: ' + (r && r.error? r.error : 'unknown'));
      } catch (e) { error('JSON invalid'); }
    });

    // init
    (function init(){
      if (!window.__three4five_sheets || !window.__three4five_sheets.getMenu) {
        error('Sheets helper belum dimuat. Pastikan APP_SCRIPT_URL benar dan data/sheets-helper.js diload.');
        console.warn('Sheets helper:', window.__three4five_sheets);
      } else {
        // set helper url if config exists
        if (window.__three4five_config && window.__three4five_config.APP_SCRIPT_URL) {
          window.__three4five_sheets.setAppScriptUrl && window.__three4five_sheets.setAppScriptUrl(window.__three4five_config.APP_SCRIPT_URL);
        }
        loadAll();
      }
    })();
  </script>
</body>
</html>
