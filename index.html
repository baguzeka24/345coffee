<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir POS - Three4Five Coffee</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { display: flex; gap: 20px; padding: 20px; margin: 0; background-color: #f4f4f9; }
    
    /* Layout Utama */
    .section-menu { flex: 2; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .section-cart { flex: 1; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    
    /* Grid Menu */
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-top: 15px; }
    .menu-card { border: 1px solid #ddd; padding: 15px; border-radius: 6px; text-align: center; cursor: pointer; background: #fafafa; transition: 0.2s; }
    .menu-card:hover { background: #eef; border-color: #007bff; }
    .menu-card h4 { margin: 0 0 8px 0; font-size: 16px; }
    .menu-card p { margin: 0; color: #28a745; font-weight: bold; }
    
    /* List Keranjang */
    .cart-list { list-style: none; padding: 0; margin: 15px 0; max-height: 300px; overflow-y: auto; }
    .cart-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
    .total-box { font-size: 18px; font-weight: bold; margin-top: 15px; text-align: right; }
    
    /* Tombol */
    .btn { width: 100%; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .btn-primary { background: #28a745; color: white; margin-top: 10px; }
    .btn-primary:disabled { background: #ccc; }
  </style>
</head>
<body>

  <!-- SEKSI DAFTAR MENU -->
  <div class="section-menu">
    <h2>Daftar Menu</h2>
    <div id="loading-menu">Memuat data menu...</div>
    <div id="menu-grid" class="menu-grid"></div>
  </div>

  <!-- SEKSI KERANJANG TRANSAKSI -->
  <div class="section-cart">
    <h2>Keranjang Transaksi</h2>
    <form id="form-transaksi">
      <ul id="cart-list" class="cart-list">
        <li style="color: #888; text-align: center;">Belum ada pesanan</li>
      </ul>
      
      <div class="total-box">
        Total: Rp <span id="total-harga">0</span>
      </div>

      <button type="submit" id="btn-submit" class="btn btn-primary" disabled>Proses Transaksi</button>
    </form>
  </div>

  <script>
    // Ganti dengan URL Web App Google Apps Script Anda
    const URL_APPS_SCRIPT = "GANTI_DENGAN_URL_WEB_APP_APPS_SCRIPT_ANDA";

    // PISAHKAN STATE: Master Menu & Data Keranjang
    let masterDataMenu = []; 
    let keranjangData = [];

    // 1. MUAT DATA MENU SAAT HALAMAN PERTAMA KALI DIBUKA
    document.addEventListener("DOMContentLoaded", function() {
      fetchMenuData();
    });

    function fetchMenuData() {
      fetch(URL_APPS_SCRIPT)
        .then(response => response.json())
        .then(data => {
          document.getElementById("loading-menu").style.display = "none";
          masterDataMenu = data; // Simpan ke Master Data (Permanen di memory JS)
          renderMenuGrid(masterDataMenu);
        })
        .catch(err => {
          document.getElementById("loading-menu").innerText = "Gagal memuat menu!";
          console.error("Error fetching menu:", err);
        });
    }

    // 2. RENDER MASTER MENU KE TAMPILAN (Tidak terpengaruh transaksi)
    function renderMenuGrid(items) {
      const menuContainer = document.getElementById("menu-grid");
      menuContainer.innerHTML = ""; 

      if (!items || items.length === 0) {
        menuContainer.innerHTML = "<p>Data menu kosong.</p>";
        return;
      }

      items.forEach(item => {
        // Penanganan properti harga/nama yang toleran
        const nama = item.Nama || item.nama || item.Item || item[0] || "Menu";
        const harga = item.Harga || item.harga || item[1] || 0;

        const card = document.createElement("div");
        card.className = "menu-card";
        card.innerHTML = `
          <h4>${nama}</h4>
          <p>Rp ${Number(harga).toLocaleString("id-ID")}</p>
        `;
        card.onclick = () => tambahKeKeranjang(nama, Number(harga));
        menuContainer.appendChild(card);
      });
    }

    // 3. TAMBAH ITEM KE KERANJANG
    function tambahKeKeranjang(nama, harga) {
      const idx = keranjangData.findIndex(i => i.nama === nama);
      if (idx > -1) {
        keranjangData[idx].qty += 1;
        keranjangData[idx].subtotal = keranjangData[idx].qty * harga;
      } else {
        keranjangData.push({ nama, harga, qty: 1, subtotal: harga });
      }
      updateCartView();
    }

    // 4. UPDATE TAMPILAN KERANJANG & TOTAL
    function updateCartView() {
      const cartContainer = document.getElementById("cart-list");
      const btnSubmit = document.getElementById("btn-submit");
      cartContainer.innerHTML = "";

      if (keranjangData.length === 0) {
        cartContainer.innerHTML = `<li style="color: #888; text-align: center;">Belum ada pesanan</li>`;
        document.getElementById("total-harga").innerText = "0";
        btnSubmit.disabled = true;
        return;
      }

      let grandTotal = 0;
      keranjangData.forEach(item => {
        grandTotal += item.subtotal;
        const li = document.createElement("li");
        li.className = "cart-item";
        li.innerHTML = `
          <span>${item.nama} x${item.qty}</span>
          <span>Rp ${item.subtotal.toLocaleString("id-ID")}</span>
        `;
        cartContainer.appendChild(li);
      });

      document.getElementById("total-harga").innerText = grandTotal.toLocaleString("id-ID");
      btnSubmit.disabled = false;
    }

    // 5. PROSES SUBMIT TRANSAKSI (AMNAN TANPA MENGHAPUS MENU)
    document.getElementById("form-transaksi").addEventListener("submit", function(e) {
      e.preventDefault(); // SANGAT PENTING: Mencegah reload/submit default browser

      const btnSubmit = document.getElementById("btn-submit");
      btnSubmit.disabled = true;
      btnSubmit.innerText = "Menyimpan...";

      // Format data pesanan sesuai kebutuhan Apps Script Anda
      const detailPesanan = keranjangData.map(i => `${i.nama} (${i.qty})`).join(", ");
      const totalBayar = keranjangData.reduce((acc, i) => acc + i.subtotal, 0);

      const formData = new URLSearchParams();
      formData.append("action", "transaksi");
      formData.append("items", detailPesanan);
      formData.append("total", totalBayar);

      fetch(URL_APPS_SCRIPT, {
        method: "POST",
        body: formData
      })
      .then(res => res.json())
      .then(res => {
        alert("Transaksi Berhasil Disimpan!");
        resetKeranjangOnly(); // Hanya hapus keranjang, Master Menu TIDAK disentuh
      })
      .catch(err => {
        alert("Gagal menyimpan transaksi, periksa koneksi.");
        console.error("Error post:", err);
      })
      .finally(() => {
        btnSubmit.innerText = "Proses Transaksi";
      });
    });

    // 6. KHUSUS UNTUK MENGOSONGKAN KERANJANG SAJA
    function resetKeranjangOnly() {
      keranjangData = []; // Kosongkan array keranjang saja
      updateCartView();   // Render ulang elemen keranjang
      // Catatan: masterDataMenu & elemen #menu-grid TIDAK ikut dikosongkan/disentuh
    }
  </script>
</body>
</html>
