<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Three4Five Coffee</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root{--primary-green:#064e3b;--primary-hover:#022c22;--light-bg:#f8fafc;--card-bg:#fff;--text-dark:#0f172a;--border-color:#e2e8f0}
    body{font-family:'Poppins',sans-serif;background:var(--light-bg);color:var(--text-dark);margin:0;min-height:100vh}
    .card{border:1px solid var(--border-color);border-radius:12px}
    .menu-img{height:110px;object-fit:cover}
    .btn-success-custom{background:var(--primary-green);color:#fff;border-radius:10px;border:0;padding:10px 14px}
    .hidden{display:none}
  </style>
</head>
<body>
  <header class="bg-white shadow-sm mb-3">
    <div class="container d-flex justify-content-between align-items-center py-3">
      <h4 class="mb-0" style="color:var(--primary-green)">Three4Five Coffee</h4>
      <div>
        <button id="nav-kasir" class="btn btn-outline-success btn-sm me-2">Kasir</button>
        <button id="nav-admin" class="btn btn-outline-primary btn-sm">Admin</button>
      </div>
    </div>
  </header>

  <main class="container mb-5">
    <!-- KASIR VIEW -->
    <section id="view-kasir">
      <div class="row g-4">
        <div class="col-lg-8">
          <div class="d-flex gap-2 mb-3 overflow-auto" id="category-bar"></div>
          <div class="row g-3" id="menu-grid"></div>
        </div>
        <div class="col-lg-4">
          <div class="card p-3 sticky-top" style="top:20px">
            <h6 class="fw-bold">Pesanan Saat Ini</h6>
            <div id="cart-list" class="mb-3">Keranjang kosong</div>
            <div class="d-flex justify-content-between mb-2"><span>Subtotal</span><strong id="subtotal-text">Rp 0</strong></div>
            <div class="d-flex justify-content-between mb-3"><span>Pajak (0%)</span><strong>Rp 0</strong></div>
            <div class="d-flex justify-content-between mb-3"><span class="fw-bold">Total</span><strong id="total-text">Rp 0</strong></div>
            <div class="mb-3">
              <label class="form-label small">Metode Pembayaran</label>
              <select id="payment-method" class="form-select mb-2"><option value="Tunai">Tunai</option><option value="QRIS">QRIS</option></select>
              <input id="cash-received" class="form-control mb-2" placeholder="Uang Tunai Diterima (opsional)" type="number">
            </div>
            <button id="btn-pay" class="btn-success-custom w-100">Proses Pembayaran</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ADMIN VIEW -->
    <section id="view-admin" class="hidden">
      <div class="row">
        <div class="col-lg-4">
          <div class="card p-3 mb-3">
            <h6>Tambah Menu</h6>
            <form id="add-menu-form">
              <input id="new-menu-name" class="form-control mb-2" placeholder="Nama Menu" required>
              <input id="new-menu-price" class="form-control mb-2" placeholder="Harga" type="number" required>
              <input id="new-menu-stock" class="form-control mb-2" placeholder="Stok" type="number" value="50">
              <select id="new-menu-category" class="form-select mb-2"><option value="ice-coffee">Ice Coffee</option><option value="americano">Americano</option><option value="non-coffee">Non Coffee</option></select>
              <button class="btn btn-success w-100" type="submit">Simpan ke Sheets</button>
            </form>
          </div>

          <div class="card p-3">
            <h6>Sync</h6>
            <button id="reload-sheets" class="btn btn-outline-primary w-100 mb-2">Reload dari Sheets</button>
            <button id="force-seed" class="btn btn-outline-secondary w-100">Force seed local (for debug)</button>
          </div>
        </div>
        <div class="col-lg-8">
          <div class="card p-3">
            <h6>Daftar Menu (dari Sheets)</h6>
            <div id="admin-menu-list"></div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <footer class="text-center py-3 text-muted">&copy; Three4Five</footer>

  <!-- App Script URL config -->
  <script>
    window.__three4five_config = { APP_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbyep_2ZvPePJfNLAhsFteZnjRmxZ0cGPhzrorCUibVrKasE87gI5U9Ube6JSbXsBQdJ4g/exec', forceSyncOnLoad: true };
  </script>
  <script src="data/sheets-helper.js" data-app-script-url="https://script.google.com/macros/s/AKfycbyep_2ZvPePJfNLAhsFteZnjRmxZ0cGPhzrorCUibVrKasE87gI5U9Ube6JSbXsBQdJ4g/exec"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // App state
    let menuList = [];
    let cart = [];

    function formatRupiah(n){ return 'Rp ' + (n||0).toLocaleString('id-ID'); }

    async function loadDataFromSheets(){
      try{
        menuList = await window.__three4five_sheets.getMenu();
        renderMenu();
        renderAdminMenuList();
        console.log('[App] loaded menu from Sheets', menuList.length);
      } catch(e){ console.error('[App] loadData error', e); }
    }

    function renderMenu(){
      const grid = document.getElementById('menu-grid'); grid.innerHTML='';
      if(!Array.isArray(menuList) || menuList.length===0){ grid.innerHTML='<div class="col-12 text-center text-muted py-4">Tidak ada menu.</div>'; return; }
      menuList.forEach(item => {
        const col = document.createElement('div'); col.className='col-md-4';
        col.innerHTML = `\n          <div class="card p-2">\n            <img src="${item.image||'https://via.placeholder.com/300x200'}" class="menu-img rounded mb-2" alt="">\n            <div class="fw-bold">${item.name||''}</div>\n            <div class="text-success">${formatRupiah(Number(item.price)||0)}</div>\n            <div class="mt-2"><button class="btn btn-outline-primary btn-sm" onclick="addToCart('${item.id}')">Tambah</button></div>\n          </div>\n        `;
        grid.appendChild(col);
      });
      renderCart();
    }

    function renderAdminMenuList(){
      const el = document.getElementById('admin-menu-list'); el.innerHTML='';
      if(!menuList.length){ el.innerHTML='<div class="text-muted">Tidak ada menu.</div>'; return; }
      let html = '<table class="table table-sm"><thead><tr><th>Nama</th><th>Kategori</th><th>Harga</th><th>Stok</th></tr></thead><tbody>';
      menuList.forEach(m=> html += `<tr><td>${m.name||''}</td><td>${m.category||''}</td><td>${formatRupiah(Number(m.price)||0)}</td><td>${m.stock||0}</td></tr>`);
      html += '</tbody></table>'; el.innerHTML = html;
    }

    function addToCart(id){
      const item = menuList.find(m=>String(m.id)===String(id)); if(!item) return; const ex = cart.find(c=>String(c.id)===String(id)); if(ex) ex.qty++; else cart.push({ id: item.id, name: item.name, price:Number(item.price)||0, qty:1 }); renderCart();
    }

    function renderCart(){
      const el = document.getElementById('cart-list'); el.innerHTML=''; if(!cart.length){ el.innerText='Keranjang masih kosong.'; document.getElementById('subtotal-text').innerText = formatRupiah(0); document.getElementById('total-text').innerText = formatRupiah(0); return; }
      let subtotal = 0; cart.forEach((c,idx)=>{ subtotal += c.price*c.qty; const row = document.createElement('div'); row.className='d-flex justify-content-between align-items-center mb-2'; row.innerHTML = `<div>${c.name} <small class="text-muted">x${c.qty}</small></div><div>${formatRupiah(c.price*c.qty)} <button class="btn btn-link btn-sm" onclick="removeCart(${idx})">hapus</button></div>`; el.appendChild(row); });
      document.getElementById('subtotal-text').innerText = formatRupiah(subtotal);
      document.getElementById('total-text').innerText = formatRupiah(subtotal);
    }

    function removeCart(idx){ cart.splice(idx,1); renderCart(); }

    document.getElementById('btn-pay').addEventListener('click', async function(){
      if(cart.length===0) return alert('Keranjang kosong');
      const method = document.getElementById('payment-method').value;
      const cash = Number(document.getElementById('cash-received').value) || 0;
      const total = cart.reduce((s,i)=>s + (i.price*i.qty),0);
      if(method==='Tunai' && cash < total) return alert('Uang tunai kurang');
      const trx = { date: new Date().toISOString(), items: cart, method: method, total: total, cashReceived: method==='Tunai'?cash:total, change: method==='Tunai'?cash-total:0, timestamp: Date.now() };
      try{
        const r = await window.__three4five_sheets.addTransaction(trx);
        if(r && r.ok){ alert('Transaksi tersimpan di Sheets'); cart = []; renderCart(); loadDataFromSheets(); }
        else alert('Gagal menyimpan transaksi');
      } catch(e){ console.error(e); alert('Error saat menyimpan transaksi'); }
    });

    // Admin: add menu via Sheets (saveMenu will replace sheet data)
    document.getElementById('add-menu-form').addEventListener('submit', async function(e){
      e.preventDefault();
      const name = document.getElementById('new-menu-name').value.trim();
      const price = Number(document.getElementById('new-menu-price').value) || 0;
      const stock = Number(document.getElementById('new-menu-stock').value) || 0;
      const category = document.getElementById('new-menu-category').value;
      // Append to current menuList then save full
      const nextId = menuList.reduce((max,m)=>Math.max(max, Number(m.id)||0),0) + 1;
      const newMenu = menuList.concat([{ id: nextId, name, price, stock, category }]);
      try{
        const r = await window.__three4five_sheets.saveMenu(newMenu);
        if(r && r.ok){ alert('Menu tersimpan ke Sheets'); loadDataFromSheets(); document.getElementById('add-menu-form').reset(); }
        else alert('Gagal simpan menu');
      } catch(err){ console.error(err); alert('Error saat menyimpan menu'); }
    });

    document.getElementById('nav-kasir').addEventListener('click', function(){ document.getElementById('view-kasir').classList.remove('hidden'); document.getElementById('view-admin').classList.add('hidden'); });
    document.getElementById('nav-admin').addEventListener('click', function(){ document.getElementById('view-kasir').classList.add('hidden'); document.getElementById('view-admin').classList.remove('hidden'); });

    document.getElementById('reload-sheets').addEventListener('click', loadDataFromSheets);
    document.getElementById('force-seed').addEventListener('click', function(){ if(window.__three4five_sheets && window.__three4five_sheets.getMenu) window.__three4five_sheets.getMenu().then(m=>{ localStorage.setItem('three4five_menu', JSON.stringify(m)); alert('Seeded local menu'); }).catch(e=>console.error(e)); });

    // init
    (function init(){
      if(window.__three4five_config && window.__three4five_config.APP_SCRIPT_URL) window.__three4five_sheets.setAppScriptUrl(window.__three4five_config.APP_SCRIPT_URL);
      loadDataFromSheets();
    })();
  </script>
</body>
</html>
