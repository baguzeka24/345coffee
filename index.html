<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Three4Five - Sheets Driven</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{font-family:Poppins, sans-serif;background:#f8fafc;color:#0f172a} .menu-img{height:90px;object-fit:cover}</style>
</head>
<body>
  <div class="container py-4">
    <h3>Three4Five - Kasir (Sheets-driven)</h3>
    <div id="alerts"></div>
    <div class="row">
      <div class="col-md-8">
        <h5>Menu</h5>
        <div id="menu-grid" class="row g-3"></div>
      </div>
      <div class="col-md-4">
        <div class="card p-3 mb-3">
          <h6>Keranjang</h6>
          <div id="cart-list">Kosong</div>
          <div class="mt-2"><strong>Total:</strong> <span id="total-text">Rp 0</span></div>
          <div class="mt-2">
            <select id="payment-method" class="form-select mb-2"><option value="Tunai">Tunai</option><option value="QRIS">QRIS</option></select>
            <input id="cash-input" class="form-control mb-2" placeholder="Uang tunai diterima (opsional)" type="number">
            <button id="pay-btn" class="btn btn-success w-100">Bayar</button>
          </div>
        </div>
        <div class="card p-3">
          <h6>Admin</h6>
          <button id="admin-open" class="btn btn-outline-primary w-100 mb-2">Admin (edit sheets)</button>
          <button id="reload" class="btn btn-outline-secondary w-100">Reload data</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // GANTI dengan Web App URL hasil deploy Apps Script
    window.__three4five_config = { APP_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbyep_2ZvPePJfNLAhsFteZnjRmxZ0cGPhzrorCUibVrKasE87gI5U9Ube6JSbXsBQdJ4g/exec', forceSyncOnLoad: false };
  </script>
  <script src="data/sheets-helper.js" data-app-script-url="https://script.google.com/macros/s/AKfycbyep_2ZvPePJfNLAhsFteZnjRmxZ0cGPhzrorCUibVrKasE87gI5U9Ube6JSbXsBQdJ4g/exec"></script>
  <script>
    // minimal app: always read from Sheets through helper
    const alerts = (m,t='info')=>{ document.getElementById('alerts').innerHTML = `<div class="alert alert-${t}">${m}</div>`; setTimeout(()=>document.getElementById('alerts').innerHTML='',3500); };
    let menuList = [], cart = [];
    function formatR(n){ return 'Rp ' + (n||0).toLocaleString('id-ID'); }
    function renderMenu(){
      const grid = document.getElementById('menu-grid'); grid.innerHTML = '';
      if(!menuList.length){ grid.innerHTML = '<div class="col-12">Tidak ada menu</div>'; return; }
      menuList.forEach(i=>{
        const col=document.createElement('div'); col.className='col-md-6';
        col.innerHTML = `<div class="card p-2">
          <div class="d-flex">
            <img src="${i.image||''}" class="menu-img rounded me-2" alt="">
            <div>
              <div class="fw-bold">${i.name||''}</div>
              <div class="text-success">${formatR(Number(i.price)||0)}</div>
              <button class="btn btn-sm btn-outline-primary mt-2" onclick="addToCart(${i.id})">Tambah</button>
            </div>
          </div>
        </div>`;
        grid.appendChild(col);
      });
      renderCart();
    }
    function addToCart(id){ const it = menuList.find(m=>String(m.id)===String(id)); if(!it){ alerts('Item tidak ditemukan','danger'); return; } const ex = cart.find(c=>String(c.id)===String(id)); if(ex) ex.qty++; else cart.push({ id: it.id, name: it.name, price: Number(it.price)||0, qty:1 }); renderCart(); }
    function renderCart(){ const el = document.getElementById('cart-list'); el.innerHTML=''; if(!cart.length){ el.innerText='Keranjang kosong'; document.getElementById('total-text').innerText='Rp 0'; return; } let total=0; cart.forEach((c,idx)=>{ total += c.qty*c.price; const row=document.createElement('div'); row.className='d-flex justify-content-between'; row.innerHTML=`<div>${c.name} x${c.qty}</div><div>${formatR(c.price*c.qty)} <button class="btn btn-link btn-sm" onclick="removeItem(${idx})">hapus</button></div>`; el.appendChild(row); }); document.getElementById('total-text').innerText = formatR(total); }
    function removeItem(idx){ cart.splice(idx,1); renderCart(); }

    async function loadAll(){
      try{
        if(!window.__three4five_sheets) return alerts('Helper belum dimuat','danger');
        if(window.__three4five_config && window.__three4five_config.APP_SCRIPT_URL) window.__three4five_sheets.setAppScriptUrl(window.__three4five_config.APP_SCRIPT_URL);
        menuList = await window.__three4five_sheets.getMenu();
        renderMenu(); alerts('Data dimuat dari Sheets','success');
      }catch(e){ console.error(e); alerts('Gagal load data: '+ (e && e.error ? e.error : e.message || e),'danger'); }
    }

    document.getElementById('reload').addEventListener('click', loadAll);
    document.getElementById('pay-btn').addEventListener('click', async ()=>{
      if(!cart.length) return alerts('Keranjang kosong','warning');
      const method = document.getElementById('payment-method') ? document.getElementById('payment-method').value : 'Tunai';
      const cash = Number(document.getElementById('cash-input').value) || 0;
      const total = cart.reduce((s,i)=>s + (i.price*i.qty),0);
      if(method==='Tunai' && cash < total) return alerts('Uang tunai kurang','danger');
      const trx = { date: new Date().toISOString(), items: cart.map(c=>({id:c.id,name:c.name,qty:c.qty,price:c.price})), method, total, cashReceived: method==='Tunai' ? cash : total, change: method==='Tunai' ? (cash-total):0, timestamp:Date.now() };
      try {
        const r = await window.__three4five_sheets.addTransaction(trx);
        if(r && r.ok){ alerts('Transaksi tersimpan di Sheets','success'); cart=[]; renderCart(); } else { alerts('Gagal simpan: '+(r && r.error? r.error:'unknown'),'danger'); }
      } catch(err){ console.error(err); alerts('Error saat menyimpan transaksi','danger'); }
    });

    (function init(){ if(window.__three4five_config && window.__three4five_config.APP_SCRIPT_URL){ if(window.__three4five_sheets) window.__three4five_sheets.setAppScriptUrl(window.__three4five_config.APP_SCRIPT_URL); loadAll(); } else { alerts('APP_SCRIPT_URL belum diset pada index.html','danger'); } })();
  </script>
</body>
</html>
