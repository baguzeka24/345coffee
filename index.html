<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Three4Five Coffee - POS</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --primary-green: #064e3b;
      --primary-hover: #022c22;
      --light-bg: #f8fafc;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --border-color: #e2e8f0;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--light-bg);
      color: var(--text-dark);
      margin: 0;
      min-height: 100vh;
    }
    .card {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background: var(--card-bg);
      box-shadow: 0 6px 18px rgba(0,0,0,0.03);
    }
    .menu-img {
      height: 110px;
      object-fit: cover;
    }
    .btn-success-custom {
      background: var(--primary-green);
      color: #fff;
      border-radius: 10px;
      padding: 10px 14px;
      border: 0;
    }
    .btn-success-custom:hover {
      background: var(--primary-hover);
    }
    .hidden {
      display: none !important;
    }
    .elegant-header {
      background: white;
      padding: 12px 28px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .login-container {
      max-width: 400px;
      margin: 80px auto;
    }
  </style>
</head>
<body>

  <!-- ==================== VIEW 1: LOGIN ==================== -->
  <div id="view-login" class="container login-container">
    <div class="card p-4 shadow-sm text-center">
      <h4 class="fw-bold mb-3" style="color:var(--primary-green)">Three4Five Coffee</h4>
      <p class="text-muted small mb-4">Masukan username dan password</p>
      
      <form id="login-form">
        <div class="mb-3 text-start">
          <label class="form-label small fw-semibold">Username</label>
          <input type="text" id="login-username" class="form-control" placeholder="admin / kasir" required>
        </div>
        <div class="mb-3 text-start">
          <label class="form-label small fw-semibold">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
        </div>
        <div class="alert alert-danger small hidden" id="login-error">Username atau password salah!</div>
        <button type="submit" class="btn btn-success-custom w-100">Masuk Aplikasi</button>
      </form>
    </div>
  </div>

  <!-- ==================== APP WRAPPER ==================== -->
  <div id="app-wrapper" class="hidden">
    
    <!-- HEADER NAVBAR (Tanpa Tombol Admin, Hanya Logout) -->
    <div class="elegant-header">
      <div class="d-flex align-items-center gap-2">
        <h4 class="mb-0" style="color:var(--primary-green)">Three4Five Coffee</h4>
        <span id="role-badge" class="badge bg-secondary">Role</span>
      </div>
      <div>
        <button id="btn-logout" class="btn btn-danger btn-sm">Logout</button>
      </div>
    </div>

    <main class="container py-4">
      
      <!-- FITUR KASIR (Tersedia untuk Admin & Kasir) -->
      <section id="view-kasir" class="mb-5">
        <div class="row g-4">
          <div class="col-lg-8">
            <div class="d-flex gap-2 mb-3 overflow-auto" id="category-bar"></div>
            <div class="row g-3" id="menu-grid"></div>
          </div>
          <div class="col-lg-4">
            <div class="card p-3 sticky-top" style="top:80px">
              <h6 class="fw-bold mb-3">Pesanan Saat Ini</h6>
              <div id="cart-list" class="mb-3 text-muted small">Keranjang kosong</div>
              <hr class="my-2">
              <div class="d-flex justify-content-between mb-2"><span>Subtotal</span><strong id="subtotal-text">Rp 0</strong></div>
              <div class="d-flex justify-content-between mb-3"><span>Pajak (0%)</span><strong>Rp 0</strong></div>
              <div class="d-flex justify-content-between mb-3 fs-5"><span class="fw-bold">Total</span><strong id="total-text" class="text-success">Rp 0</strong></div>
              <div class="mb-3">
                <label class="form-label small">Metode Pembayaran</label>
                <select id="payment-method" class="form-select mb-2">
                  <option value="Tunai">Tunai</option>
                  <option value="QRIS">QRIS</option>
                </select>
                <input id="cash-received" class="form-control mb-2" placeholder="Uang Tunai Diterima (opsional)" type="number">
              </div>
              <button id="btn-pay" class="btn-success-custom w-100 fw-bold">Proses Pembayaran</button>
            </div>
          </div>
        </div>
      </section>

      <!-- PANEL KELOLA DATA (Hanya muncul jika Role = Admin) -->
      <section id="view-admin" class="hidden border-top pt-4">
        <h5 class="fw-bold mb-3 text-primary">Panel Admin / Kelola Data</h5>
        <div class="row g-4">
          <div class="col-lg-4">
            <div class="card p-3 mb-3">
              <h6 class="fw-bold mb-3">Tambah Menu Baru</h6>
              <form id="add-menu-form">
                <input id="new-menu-name" class="form-control mb-2" placeholder="Nama Menu" required>
                <input id="new-menu-price" class="form-control mb-2" placeholder="Harga" type="number" required>
                <input id="new-menu-stock" class="form-control mb-2" placeholder="Stok" type="number" value="50">
                <select id="new-menu-category" class="form-select mb-3">
                  <option value="ice-coffee">Ice Coffee</option>
                  <option value="americano">Americano</option>
                  <option value="non-coffee">Non Coffee</option>
                </select>
                <button class="btn btn-success w-100" type="submit">Simpan ke Sheets</button>
              </form>
            </div>
            <div class="card p-3">
              <h6 class="fw-bold mb-3">Sinkronisasi Data</h6>
              <button id="reload-sheets" class="btn btn-outline-primary w-100 mb-2">Reload dari Sheets</button>
              <button id="force-seed" class="btn btn-outline-secondary w-100">Force seed local (debug)</button>
            </div>
          </div>
          <div class="col-lg-8">
            <div class="card p-3">
              <h6 class="fw-bold mb-3">Daftar Menu (dari Sheets)</h6>
              <div id="admin-menu-list"></div>
            </div>
          </div>
        </div>
      </section>

    </main>
    <footer class="text-center py-3 text-muted border-top">&copy; Three4Five Coffee</footer>
  </div>

  <!-- Config & Script Integrasi Sheets -->
  <script>
    window.__three4five_config = {
      APP_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbyep_2ZvPePJfNLAhsFteZnjRmxZ0cGPhzrorCUibVrKasE87gI5U9Ube6JSbXsBQdJ4g/exec',
      forceSyncOnLoad: true
    };
  </script>
  <script src="data/sheets-helper.js" data-app-script-url="https://script.google.com/macros/s/AKfycbyep_2ZvPePJfNLAhsFteZnjRmxZ0cGPhzrorCUibVrKasE87gI5U9Ube6JSbXsBQdJ4g/exec"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    let menuList = [];
    let cart = [];
    let currentUser = null;

    // Kredensial Role
    const USERS = {
      'admin': { password: '123', role: 'admin' },
      'kasir': { password: '123', role: 'kasir' }
    };

    function formatRupiah(n){
      return 'Rp ' + (n||0).toLocaleString('id-ID');
    }

    // ==================== LOGIKA LOGIN & LOGOUT ====================
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const userVal = document.getElementById('login-username').value.trim().toLowerCase();
      const passVal = document.getElementById('login-password').value;
      const errEl = document.getElementById('login-error');

      if (USERS[userVal] && USERS[userVal].password === passVal) {
        errEl.classList.add('hidden');
        currentUser = { username: userVal, role: USERS[userVal].role };
        
        // Simpan Session ke LocalStorage
        localStorage.setItem('three4five_user', JSON.stringify(currentUser));
        initAppView();
      } else {
        errEl.classList.remove('hidden');
      }
    });

    // LOGOUT: Kembali ke Login
    document.getElementById('btn-logout').addEventListener('click', function() {
      localStorage.removeItem('three4five_user');
      currentUser = null;
      document.getElementById('app-wrapper').classList.add('hidden');
      document.getElementById('view-login').classList.remove('hidden');
      document.getElementById('login-form').reset();
    });

    function initAppView() {
      if (!currentUser) return;

      document.getElementById('view-login').classList.add('hidden');
      document.getElementById('app-wrapper').classList.remove('hidden');

      const badge = document.getElementById('role-badge');
      badge.innerText = currentUser.role.toUpperCase();
      badge.className = currentUser.role === 'admin' ? 'badge bg-primary' : 'badge bg-success';

      const adminSection = document.getElementById('view-admin');
      
      // Jika login sebagai Admin, tampilkan section kelola data di bawah
      if (currentUser.role === 'admin') {
        adminSection.classList.remove('hidden');
      } else {
        adminSection.classList.add('hidden');
      }

      loadDataFromSheets();
    }

    // ==================== INTEGRASI SPREADSHEET ====================
    async function loadDataFromSheets(){
      try{
        menuList = await window.__three4five_sheets.getMenu();
        renderMenu();
        renderAdminMenuList();
      } catch(e){
        console.error('[App] loadData error', e);
        alert('Gagal memuat data dari Sheets.');
      }
    }

    function renderMenu(){
      const grid = document.getElementById('menu-grid');
      grid.innerHTML = '';
      if(!Array.isArray(menuList) || menuList.length===0){
        grid.innerHTML='<div class="col-12 text-center text-muted py-4">Tidak ada menu.</div>';
        return;
      }
      menuList.forEach(item => {
        const col = document.createElement('div');
        col.className = 'col-md-4';
        col.innerHTML = `
          <div class="card p-2">
            <img src="${item.image || 'https://via.placeholder.com/300x200'}" class="menu-img rounded mb-2" alt="">
            <div class="fw-bold">${item.name||''}</div>
            <div class="text-success">${formatRupiah(Number(item.price)||0)}</div>
            <div class="mt-2"><button class="btn btn-outline-primary btn-sm w-100" onclick="addToCart('${item.id}')">Tambah</button></div>
          </div>
        `;
        grid.appendChild(col);
      });
      renderCart();
    }

    function renderAdminMenuList(){
      const el = document.getElementById('admin-menu-list');
      el.innerHTML = '';
      if(!menuList.length){
        el.innerHTML = '<div class="text-muted">Tidak ada menu.</div>';
        return;
      }
      let html = '<table class="table table-sm align-middle"><thead><tr><th>Nama</th><th>Kategori</th><th>Harga</th><th>Stok</th></tr></thead><tbody>';
      menuList.forEach(m => {
        html += `<tr><td>${m.name||''}</td><td>${m.category||''}</td><td>${formatRupiah(Number(m.price)||0)}</td><td>${m.stock||0}</td></tr>`;
      });
      html += '</tbody></table>';
      el.innerHTML = html;
    }

    function addToCart(id){
      const item = menuList.find(m => String(m.id) === String(id));
      if(!item) return;
      const ex = cart.find(c => String(c.id) === String(id));
      if(ex) ex.qty++;
      else cart.push({ id: item.id, name: item.name, price: Number(item.price)||0, qty: 1 });
      renderCart();
    }

    function renderCart(){
      const el = document.getElementById('cart-list');
      el.innerHTML = '';
      if(!cart.length){
        el.innerText = 'Keranjang masih kosong.';
        document.getElementById('subtotal-text').innerText = formatRupiah(0);
        document.getElementById('total-text').innerText = formatRupiah(0);
        return;
      }
      let subtotal = 0;
      cart.forEach((c, idx) => {
        subtotal += c.price * c.qty;
        const row = document.createElement('div');
        row.className = 'd-flex justify-content-between align-items-center mb-2';
        row.innerHTML = `<div>${c.name} <small class="text-muted">x${c.qty}</small></div><div>${formatRupiah(c.price*c.qty)} <button class="btn btn-link btn-sm text-danger p-0 ms-2" onclick="removeCart(${idx})">hapus</button></div>`;
        el.appendChild(row);
      });
      document.getElementById('subtotal-text').innerText = formatRupiah(subtotal);
      document.getElementById('total-text').innerText = formatRupiah(subtotal);
    }

    function removeCart(idx){
      cart.splice(idx,1);
      renderCart();
    }

    document.getElementById('btn-pay').addEventListener('click', async function(){
      if(cart.length === 0) return alert('Keranjang kosong');
      const method = document.getElementById('payment-method').value;
      const cash = Number(document.getElementById('cash-received').value) || 0;
      const total = cart.reduce((s,i) => s + (i.price*i.qty), 0);
      if(method === 'Tunai' && cash < total) return alert('Uang tunai kurang');

      const trx = {
        date: new Date().toISOString(),
        items: cart,
        method: method,
        total: total,
        cashReceived: method === 'Tunai' ? cash : total,
        change: method === 'Tunai' ? cash - total : 0,
        timestamp: Date.now()
      };

      try {
        const r = await window.__three4five_sheets.addTransaction(trx);
        if(r && r.ok){
          alert('Transaksi tersimpan di Sheets');
          cart = [];
          renderCart();
          loadDataFromSheets();
        } else alert('Gagal menyimpan transaksi');
      } catch(e){
        console.error(e);
        alert('Error saat menyimpan transaksi');
      }
    });

    document.getElementById('add-menu-form').addEventListener('submit', async function(e){
      e.preventDefault();
      const name = document.getElementById('new-menu-name').value.trim();
      const price = Number(document.getElementById('new-menu-price').value) || 0;
      const stock = Number(document.getElementById('new-menu-stock').value) || 0;
      const category = document.getElementById('new-menu-category').value;
      const nextId = menuList.reduce((max,m) => Math.max(max, Number(m.id)||0), 0) + 1;
      const newMenu = menuList.concat([{ id: nextId, name, price, stock, category }]);

      try {
        const r = await window.__three4five_sheets.saveMenu(newMenu);
        if(r && r.ok){
          alert('Menu tersimpan ke Sheets');
          loadDataFromSheets();
          document.getElementById('add-menu-form').reset();
        } else alert('Gagal simpan menu');
      } catch(err){
        console.error(err);
        alert('Error saat menyimpan menu');
      }
    });

    document.getElementById('reload-sheets').addEventListener('click', loadDataFromSheets);
    document.getElementById('force-seed').addEventListener('click', function(){
      if(window.__three4five_sheets && window.__three4five_sheets.getMenu) {
        window.__three4five_sheets.getMenu().then(m => {
          localStorage.setItem('three4five_menu', JSON.stringify(m));
          alert('Seeded local menu');
        }).catch(e => console.error(e));
      }
    });

    // Cek Session Saat Aplikasi Dimuat
    (function init(){
      if(window.__three4five_config && window.__three4five_config.APP_SCRIPT_URL) {
        window.__three4five_sheets.setAppScriptUrl(window.__three4five_config.APP_SCRIPT_URL);
      }
      
      const savedUser = localStorage.getItem('three4five_user');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        initAppView();
      }
    })();
  </script>
</body>
</html>
